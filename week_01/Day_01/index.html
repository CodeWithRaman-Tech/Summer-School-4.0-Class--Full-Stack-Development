<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer Vibes Day 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene">
    <div class="sky">
      <div class="sun"></div>
      <div class="sun-ray ray-1"></div>
      <div class="sun-ray ray-2"></div>
      <div class="sun-ray ray-3"></div>
      <div class="sun-ray ray-4"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="bird bird-1"></div>
      <div class="bird bird-2"></div>
    </div>
    <div class="headline-panel">
      <p>Day 1 Summer Launch</p>
      <h1>Hello Summer World</h1>
      <p class="subtitle">A warm breeze, glimmering waves, and bright beach energy.</p>
      <button class="cta">Turn Up the Vibes</button>
    </div>
    <div class="water">
      <div class="wave wave-back"></div>
      <div class="wave wave-middle"></div>
      <div class="wave wave-front"></div>
      <div class="bubble-container"></div>
    </div>
    <div class="shore">
      <div class="sand"></div>
      <div class="palm palm-left"></div>
      <div class="palm palm-right"></div>
      <div class="shell shell-1"></div>
      <div class="shell shell-2"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
