<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Science Result Checker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        width: 420px;
      }

      h2 {
        text-align: center;
      }

      .marks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 20px 0;
      }

      input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #45a049;
      }

      #result {
        margin-top: 20px;
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Science Result Checker</h2>
      <div class="marks">
        <input type="number" id="m1" placeholder="Subject 1" />
        <input type="number" id="m2" placeholder="Subject 2" />
        <input type="number" id="m3" placeholder="Subject 3" />
        <input type="number" id="m4" placeholder="Subject 4" />
        <input type="number" id="m5" placeholder="Subject 5" />
      </div>
      <button onclick="checkResult()">Check Result</button>
      <div id="result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
