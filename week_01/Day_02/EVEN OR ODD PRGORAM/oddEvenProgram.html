<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odd or Even Checker</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dff9ff, #f5f5f5);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        width: 400px;
        text-align: center;
      }

      h2 {
        color: #333;
      }

      input {
        width: 90%;
        padding: 12px;
        margin: 15px 0;
        border: 2px solid #8ecae6;
        border-radius: 10px;
        font-size: 16px;
      }

      button {
        background: #219ebc;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1a7f9b;
      }

      #result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        color: #0a6b27;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Odd or Even Number Checker</h2>

      <input type="number" id="numberInput" placeholder="Enter a number" />
      <br />
      <button onclick="checkNumber()">Check</button>

      <div id="result">Result will show here</div>
    </div>

    <script>
      // This function checks whether the entered number is odd or even.
      function checkNumber() {
        // Read the value typed by the user from the input box.
        const number = Number(document.getElementById('numberInput').value);

        // Check if the number is divisible by 2 without remainder.
        // If remainder is 0, then it is even.
        if (number % 2 === 0) {
          document.getElementById('result').textContent = 'Even Number';
          document.getElementById('result').style.color = '#0a6b27';
        } else {
          // If remainder is not 0, then it is odd.
          document.getElementById('result').textContent = 'Odd Number';
          document.getElementById('result').style.color = '#b71c1c';
        }
      }
    </script>
  </body>
</html>
